<title>DOS 486</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: la pantalla de DOS arriba, a todo el ancho; debajo, los comandos listos para cargar cada programa.
   Un solo look oscuro a proposito: es una pantalla de DOS. */
:root {
  --bg: #0d0e11;
  --panel: #17191e;
  --line: #2b2e36;
  --ink: #e4e1d8;
  --dim: #8f8c84;
  --phosphor: #c7c7c7;
  --key: #ffd75a;          /* amarillo de DOS para los comandos */
  --f-crt: "VT323", "Courier New", monospace;
  --f-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 400 14px/1.5 var(--f-body);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.screen { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: #000; border: 1px solid var(--line);
  border-radius: 6px; overflow: hidden; outline: none; }
.screen:focus-visible { border-color: var(--key); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.text { position: absolute; inset: 0; margin: 0; padding: 4% 5%; color: var(--phosphor); font: 400 clamp(16px, 3.2vw, 26px)/1.15 var(--f-crt);
  white-space: pre-wrap; overflow: hidden; }
.text .err { color: #ff6b6b; }
.text .blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar .status { color: var(--dim); min-width: 0; }
.bar button { font: 500 13px var(--f-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--dim); }

.cmds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cmds button { min-width: 0; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.cmds button .c { font: 400 24px/1 var(--f-crt); color: var(--key); letter-spacing: .02em; }
.cmds button .c::before { content: "C:\\>"; color: var(--dim); margin-right: 2px; }
.cmds button .t { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.cmds button:hover:not(:disabled) { border-color: var(--key); }
.cmds button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .text .blink { animation: none; } }
@media (max-width: 480px) { .cmds { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmds button .c { font-size: 21px; } }
</style>

<main class="wrap">
  <div class="screen" id="screen" tabindex="0" aria-label="Pantalla de DOS">
    <canvas id="cv" width="720" height="400" hidden></canvas>
    <pre class="text" id="txt"></pre>
  </div>

  <div class="bar">
    <span class="status" id="status">Cargando…</span>
    <button id="reset" type="button">Reiniciar</button>
  </div>

  <div class="cmds" id="cmds"></div>
</main>

<script src="emulators/emulators.js"></script>
<script>
(() => {
const CMDS = [
  ['DOOM', 'DOOM 1.9 (1993)'], ['WOLF3D', 'Wolfenstein 3D (1992)'], ['DUKE3D', 'Duke Nukem 3D (1996)'], ['DUKE2', 'Duke Nukem II (1993)'],
  ['HERETIC', 'Heretic (1994)'], ['KEEN1', 'Commander Keen 1 (1990)'], ['KEEN4', 'Commander Keen 4 (1991)'], ['DAVE', 'Dangerous Dave (1990)'],
  ['SCORCH', 'Scorched Earth (1991)'], ['PINBALL', 'Epic Pinball (1993)'], ['SKYROADS', 'SkyRoads (1993)'], ['ZZT', 'ZZT (1991)'],
  ['TP', 'Turbo Pascal 5.5 (1989)'], ['EDIT', 'Editor de texto'],
];
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), txt = $('txt'), screenEl = $('screen'), statusEl = $('status');
let ci = null, bundle = null, ready = false, typing = false, audio = null, nextT = 0, session = 0;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

$('cmds').innerHTML = CMDS.map(([c, t]) => `<button type="button" data-cmd="${c}" disabled><span class="c">${c}</span><span class="t">${t}</span></button>`).join('');
const setEnabled = (v) => document.querySelectorAll('#cmds button').forEach(b => { b.disabled = !v; });
const say = (html) => { txt.innerHTML = html; };

/* ---------- carga de discos ---------- */
async function fetchWithProgress(url, onp) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) { const b = new Uint8Array(await r.arrayBuffer()); onp(1); return b; }
  const rd = r.body.getReader(); const parts = []; let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onp(got / total); }
  const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out;
}
/* Cada disco llega como texto base64 de la imagen comprimida con gzip */
async function unpack(b64bytes) {
  const bin = atob(new TextDecoder().decode(b64bytes).trim());
  const gz = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) gz[i] = bin.charCodeAt(i);
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* Paquete para el emulador: zip sin compresion armado aqui mismo */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(d) { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function storeZip(entries) {
  const enc = new TextEncoder(), locals = [], cds = []; let off = 0;
  for (const [name, data] of entries) {
    const n = enc.encode(name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, n.length, true);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(14, 0x21, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, n.length, true);
    cd.setUint32(42, off, true);
    locals.push(new Uint8Array(lh.buffer), n, data); cds.push(new Uint8Array(cd.buffer), n);
    off += 30 + n.length + data.length;
  }
  const cdSize = cds.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  const parts = [...locals, ...cds, new Uint8Array(end.buffer)];
  const out = new Uint8Array(parts.reduce((a, b) => a + b.length, 0)); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
async function loadDisks() {
  let pc = 0, pd = 0;
  const show = () => say(`Cargando disco C: ${String(Math.round(pc * 100)).padStart(3)}%\nCargando disco D: ${String(Math.round(pd * 100)).padStart(3)}%<span class="blink">_</span>`);
  show();
  const raw = await Promise.all([
    fetchWithProgress('disk-c.img.gz.txt', p => { pc = p; show(); }),
    fetchWithProgress('disk-d.img.gz.txt', p => { pd = p; show(); }),
  ]);
  say('Preparando discos...<span class="blink">_</span>');
  const disks = await Promise.all(raw.map(unpack));
  const conf = await (await fetch('dosbox.conf.txt')).text();
  return storeZip([['.jsdos/dosbox.conf', new TextEncoder().encode(conf)], ['c.img', disks[0]], ['d.img', disks[1]]]);
}

/* ---------- DOS listo: FDAUTO.BAT dibuja una barra solida al terminar ---------- */
function hasReadyBar(data, w, h) {
  const rowH = h / 25;
  for (let r = 0; r < 25; r++) {
    const y = Math.floor(r * rowH + rowH / 2); let lit = 0, n = 0;
    for (let x = 8; x < w - 16; x += 4) { const i = (y * w + x) * 4; n++; if (data[i] + data[i + 1] + data[i + 2] > 120) lit++; }
    if (lit / n > 0.9) return true;
  }
  return false;
}
function markReady(id) {
  if (ready || id !== session) return;
  ready = true; setEnabled(true); statusEl.textContent = 'Listo. Un clic escribe el comando en DOS. Sal del programa abierto antes de cargar otro.';
}

/* ---------- audio (empieza con el primer clic o tecla) ---------- */
function wakeAudio() {
  if (audio) { if (audio.state === 'suspended') audio.resume().catch(() => {}); return; }
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; }
}
function pushSound(samples) {
  if (!audio || audio.state !== 'running' || !ci) return;
  const now = audio.currentTime;
  if (nextT < now + 0.02) nextT = now + 0.05;
  if (nextT - now > 0.35) return;
  const buf = audio.createBuffer(1, samples.length, ci.soundFrequency() || 44100); buf.copyToChannel(samples, 0);
  const src = audio.createBufferSource(); src.buffer = buf; src.connect(audio.destination); src.start(nextT);
  nextT += buf.duration;
}

/* ---------- arranque ---------- */
async function boot() {
  const id = ++session; ready = false; setEnabled(false);
  try {
    if (!bundle) { statusEl.textContent = 'Cargando discos…'; bundle = await loadDisks(); }
    if (id !== session) return;
    statusEl.textContent = 'Arrancando FreeDOS…'; say('Arrancando FreeDOS...<span class="blink">_</span>');
    if (!window.emulators) throw new Error('no se cargó el emulador');
    emulators.pathPrefix = 'emulators/';
    const c = await emulators.dosboxXWorker([bundle]);
    if (id !== session) { c.exit().catch(() => {}); return; }
    ci = c;
    let shown = false; const t0 = performance.now();
    ci.events().onFrame((rgb, rgba) => {
      if (id !== session || !ci) return;
      const w = ci.width(), h = ci.height(); if (!w || !h) return;
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      let data = rgba;
      if (!data && rgb) { data = new Uint8ClampedArray(w * h * 4);
        for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) { data[j] = rgb[i]; data[j + 1] = rgb[i + 1]; data[j + 2] = rgb[i + 2]; data[j + 3] = 255; } }
      if (!data || data.length < w * h * 4) return;
      ctx.putImageData(new ImageData(new Uint8ClampedArray(data.buffer, data.byteOffset, w * h * 4), w, h), 0, 0);
      if (!shown && performance.now() - t0 > 600) { shown = true; cv.hidden = false; txt.hidden = true; }
      if (!ready && h === 400 && hasReadyBar(data, w, h)) setTimeout(() => markReady(id), 500);
    });
    ci.events().onSoundPush(pushSound);
    setTimeout(() => markReady(id), 40000);   /* por si no se detecta la barra */
  } catch (err) {
    if (id !== session) return;
    cv.hidden = true; txt.hidden = false;
    say('<span class="err">No se pudo iniciar DOS en este navegador.</span>\n' + String(err && err.message || err).replace(/[&<]/g, c => c === '&' ? '&amp;' : '&lt;'));
    statusEl.textContent = 'Error al iniciar.';
  }
}
async function reset() {
  session++; ready = false; setEnabled(false);
  const c = ci; ci = null; if (c) { try { await c.exit(); } catch (_) {} }
  cv.hidden = true; txt.hidden = false;
  boot();
}
$('reset').addEventListener('click', () => { wakeAudio(); reset(); });

/* ---------- comandos preseteados: se escriben en DOS tecla a tecla ---------- */
async function tap(k) { if (!ci) return; ci.sendKeyEvent(k, true); await sleep(35); if (ci) ci.sendKeyEvent(k, false); await sleep(35); }
async function typeCommand(cmd) {
  if (!ci || !ready || typing) return;
  typing = true; setEnabled(false);
  try { for (const ch of cmd) await tap(ch.charCodeAt(0)); await tap(257); }
  finally { typing = false; setEnabled(true); screenEl.focus(); }
}
$('cmds').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  wakeAudio(); typeCommand(b.dataset.cmd);
});

/* ---------- teclado ---------- */
const K = { Escape:256, Enter:257, Tab:258, Backspace:259, Insert:260, Delete:261, ArrowRight:262, ArrowLeft:263, ArrowDown:264, ArrowUp:265,
  PageUp:266, PageDown:267, Home:268, End:269, CapsLock:280, ScrollLock:281, NumLock:282, Pause:284, Space:32,
  ShiftLeft:340, ControlLeft:341, AltLeft:342, ShiftRight:344, ControlRight:345, AltRight:346,
  Minus:45, Equal:61, Backslash:92, BracketLeft:91, BracketRight:93, Semicolon:59, Quote:39, Period:46, Comma:44, Slash:47, Backquote:96,
  NumpadEnter:335, NumpadAdd:334, NumpadSubtract:333, NumpadMultiply:332, NumpadDivide:331, NumpadDecimal:330, IntlBackslash:348 };
function code2key(code) {
  if (K[code] !== undefined) return K[code];
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1].charCodeAt(0);
  if ((m = /^Digit([0-9])$/.exec(code))) return 48 + +m[1];
  if ((m = /^F([0-9]{1,2})$/.exec(code))) return 289 + +m[1];
  if ((m = /^Numpad([0-9])$/.exec(code))) return 320 + +m[1];
  return null;
}
function keyEvent(e, down) {
  if (!ci || e.metaKey) return;
  if (e.target.closest && e.target.closest('button, a')) return;
  const k = code2key(e.code); if (k === null) return;
  e.preventDefault(); wakeAudio();
  ci.sendKeyEvent(k, down);
}
addEventListener('keydown', e => keyEvent(e, true));
addEventListener('keyup', e => keyEvent(e, false));
screenEl.addEventListener('click', () => { wakeAudio(); screenEl.focus(); });

/* ---------- raton: doble clic en la pantalla lo captura ---------- */
screenEl.addEventListener('dblclick', () => { if (ci && screenEl.requestPointerLock) { try { const p = screenEl.requestPointerLock(); p && p.catch && p.catch(() => {}); } catch (_) {} } });
document.addEventListener('mousemove', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseRelativeMotion(e.movementX, e.movementY); });
screenEl.addEventListener('mousedown', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseButton(e.button === 2 ? 1 : 0, true); });
screenEl.addEventListener('mouseup', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseButton(e.button === 2 ? 1 : 0, false); });
screenEl.addEventListener('contextmenu', e => e.preventDefault());

boot();
})();
</script>
