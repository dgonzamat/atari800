<title>DOS 486</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: la pantalla de DOS arriba, a todo el ancho; debajo, los comandos listos para cargar cada programa.
   Un solo look oscuro a proposito: es una pantalla de DOS. */
:root {
  --bg: #0d0e11;
  --panel: #17191e;
  --line: #2b2e36;
  --ink: #e4e1d8;
  --dim: #8f8c84;
  --phosphor: #c7c7c7;
  --key: #ffd75a;          /* amarillo de DOS para los comandos */
  --f-crt: "VT323", "Courier New", monospace;
  --f-body: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font: 400 14px/1.5 var(--f-body);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.screen { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; background: #000; border: 1px solid var(--line);
  border-radius: 6px; overflow: hidden; outline: none; }
.screen:focus-visible { border-color: var(--key); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.text { position: absolute; inset: 0; margin: 0; padding: 4% 5%; color: var(--phosphor); font: 400 clamp(16px, 3.2vw, 26px)/1.15 var(--f-crt);
  white-space: pre-wrap; overflow: hidden; }
.text .err { color: #ff6b6b; }
.text.term { padding: 2% 2%; line-height: 1.12; white-space: pre; font-family: "JetBrains Mono", ui-monospace, monospace; }
.cmds button[data-bbs] .c::before { content: none; }
.text .w { color: #fff; } .text .c { color: #55ffff; }
.off { position: absolute; inset: 0; display: grid; place-items: center; color: #55575e; font: 500 15px var(--f-body); text-align: center; padding: 16px; }
.text .blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar .status { color: var(--dim); min-width: 0; }
.bar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hdd { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #3b2f12; box-shadow: inset 0 1px 1px rgba(0,0,0,.6); }
.hdd.on { background: #ffb43a; box-shadow: 0 0 8px #ffb43a; }
.pwr { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #14301b; }
.pwr.on { background: #4cff6a; box-shadow: 0 0 8px #4cff6a; }
.bar .acts { display: flex; gap: 8px; }
.bar button#power { border-color: #4cff6a; color: #4cff6a; }
.bar button[aria-pressed="true"] { color: var(--dim); }
.bar button { font: 500 13px var(--f-body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--dim); }

.cmds { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cmds button { min-width: 0; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 12px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.cmds button .c { font: 400 24px/1 var(--f-crt); color: var(--key); letter-spacing: .02em; }
.cmds button .c::before { content: "C:\\>"; color: var(--dim); margin-right: 2px; }
.cmds button .t { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.cmds button:hover:not(:disabled) { border-color: var(--key); }
.cmds button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .text .blink { animation: none; } }
@media (max-width: 480px) { .cmds { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmds button .c { font-size: 21px; } }
</style>

<main class="wrap">
  <div class="screen" id="screen" tabindex="0" aria-label="Pantalla de DOS">
    <canvas id="cv" width="720" height="400" hidden></canvas>
    <pre class="text" id="txt" hidden></pre>
    <div class="off" id="off">Pulsa Encender</div>
  </div>

  <div class="bar">
    <span class="left"><i class="pwr" id="pwr" title="Encendido"></i><i class="hdd" id="hdd" title="Disco duro"></i><span class="status" id="status">Apagado</span></span>
    <span class="acts"><button id="snd" type="button" aria-pressed="false">Sonido: sí</button><button id="power" type="button">Encender</button></span>
  </div>

  <div class="cmds" id="cmds"></div>
</main>

<script src="emulators/emulators.js"></script>
<script>
(() => {
const CMDS = [
  ['DOOM', 'DOOM 1.9 (1993)'], ['WOLF3D', 'Wolfenstein 3D (1992)'], ['DUKE3D', 'Duke Nukem 3D (1996)'], ['DUKE2', 'Duke Nukem II (1993)'],
  ['HERETIC', 'Heretic (1994)'], ['KEEN1', 'Commander Keen 1 (1990)'], ['KEEN4', 'Commander Keen 4 (1991)'], ['DAVE', 'Dangerous Dave (1990)'],
  ['SCORCH', 'Scorched Earth (1991)'], ['PINBALL', 'Epic Pinball (1993)'], ['SKYROADS', 'SkyRoads (1993)'], ['ZZT', 'ZZT (1991)'],
  ['LEMMINGS', 'Lemmings demo (1991)'], ['PRINCE', 'Prince of Persia demo (1990)'], ['STUNTS', 'Stunts demo (1990)'], ['CARMA', 'Carmageddon demo (1997)'], ['ANOTHER', 'Another World demo (1991)'], ['TP', 'Turbo Pascal 5.5 (1989)'], ['EDIT', 'Editor de texto'], ['BBS', 'BBS simulado (sin red)'],
];
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), txt = $('txt'), screenEl = $('screen'), statusEl = $('status');
let ci = null, bundle = null, ready = false, typing = false, session = 0;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

$('cmds').innerHTML = CMDS.map(([c, t]) => `<button type="button" data-cmd="${c}" disabled><span class="c">${c}</span><span class="t">${t}</span></button>`).join('');
const setEnabled = (v) => document.querySelectorAll('#cmds button').forEach(b => { b.disabled = !v; });
const say = (html) => { txt.innerHTML = html; };

/* ---------- carga de discos ---------- */
async function fetchWithProgress(url, onp) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) { const b = new Uint8Array(await r.arrayBuffer()); onp(1); return b; }
  const rd = r.body.getReader(); const parts = []; let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onp(got / total); }
  const out = new Uint8Array(got); let o = 0; for (const p of parts) { out.set(p, o); o += p.length; } return out;
}
/* Cada disco llega como texto base64 de la imagen comprimida con gzip */
async function unpack(b64bytes) {
  const bin = atob(new TextDecoder().decode(b64bytes).trim());
  const gz = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) gz[i] = bin.charCodeAt(i);
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* Paquete para el emulador: zip sin compresion armado aqui mismo */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(d) { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function storeZip(entries) {
  const enc = new TextEncoder(), locals = [], cds = []; let off = 0;
  for (const [name, data] of entries) {
    const n = enc.encode(name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, n.length, true);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(14, 0x21, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, n.length, true);
    cd.setUint32(42, off, true);
    locals.push(new Uint8Array(lh.buffer), n, data); cds.push(new Uint8Array(cd.buffer), n);
    off += 30 + n.length + data.length;
  }
  const cdSize = cds.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  const parts = [...locals, ...cds, new Uint8Array(end.buffer)];
  const out = new Uint8Array(parts.reduce((a, b) => a + b.length, 0)); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
async function loadDisks(onp) {
  let pc = 0, pd = 0;
  const show = () => onp((pc + pd) / 2);
  const manifest = await (await fetch('disks.json')).json();
  const getDisk = async (parts, set) => {
    const done = new Array(parts.length).fill(0);
    const chunks = await Promise.all(parts.map((u, i) => fetchWithProgress(u, q => { done[i] = q; set(done.reduce((a, b) => a + b, 0) / parts.length); })));
    const all = new Uint8Array(chunks.reduce((a, b) => a + b.length, 0)); let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    return all;
  };
  const raw = await Promise.all([getDisk(manifest.c, p => { pc = p; show(); }), getDisk(manifest.d, p => { pd = p; show(); })]);
  const disks = await Promise.all(raw.map(unpack));
  const conf = await (await fetch('dosbox.conf.txt')).text();
  return storeZip([['.jsdos/dosbox.conf', new TextEncoder().encode(conf)], ['c.img', disks[0]], ['d.img', disks[1]]]);
}

/* ---------- DOS listo: FDAUTO.BAT dibuja una barra solida al terminar ---------- */
function hasReadyBar(data, w, h) {
  const rowH = h / 25;
  for (let r = 0; r < 25; r++) {
    const y = Math.floor(r * rowH + rowH / 2); let lit = 0, n = 0;
    for (let x = 8; x < w - 16; x += 4) { const i = (y * w + x) * 4; n++; if (data[i] + data[i + 1] + data[i + 2] > 120) lit++; }
    if (lit / n > 0.9) return true;
  }
  return false;
}
function markReady(id) {
  if (ready || id !== session) return;
  ready = true; setEnabled(true); statusEl.textContent = 'Listo. Un clic escribe el comando en DOS; sal del programa abierto antes de cargar otro.';
}

/* ---------- sonidos del 486 (sintetizados, no son grabaciones) ---------- */
let audio = null, master = null, nextT = 0, soundOn = true, hum = [];
const hddLed = $('hdd');
function ensureAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; return; }
    master = audio.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(audio.destination);
  }
  if (audio.state === 'suspended') audio.resume().catch(() => {});
}
function noiseBuffer(sec) {
  const b = audio.createBuffer(1, Math.floor(audio.sampleRate * sec), audio.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function thump(t, f, dur, peak) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + dur);
  env(g, t, peak, 0.004, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function click(t, freq, dur, peak) {
  const n = audio.createBufferSource(); n.buffer = noiseBuffer(dur + 0.02);
  const f = audio.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
  const g = audio.createGain(); env(g, t, peak, 0.001, dur);
  n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + dur + 0.03);
}
const SFX = {
  powerOn() {   /* rele de la fuente, ventilador y disco duro acelerando */
    if (!audio) return; const t = audio.currentTime + 0.02;
    thump(t, 60, 0.22, 0.5); click(t, 900, 0.03, 0.25);
    const fan = audio.createBufferSource(); fan.buffer = noiseBuffer(2); fan.loop = true;
    const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.6;
    const fg = audio.createGain(); fg.gain.setValueAtTime(0.0001, t); fg.gain.exponentialRampToValueAtTime(0.06, t + 1.4);
    fan.connect(lp).connect(fg).connect(master); fan.start(t);
    const hm = audio.createOscillator(); hm.type = 'triangle'; hm.frequency.value = 100;
    const hg = audio.createGain(); hg.gain.setValueAtTime(0.0001, t); hg.gain.exponentialRampToValueAtTime(0.008, t + 1);
    hm.connect(hg).connect(master); hm.start(t);
    const sp = audio.createOscillator(); sp.type = 'sawtooth';
    sp.frequency.setValueAtTime(25, t + 0.3); sp.frequency.exponentialRampToValueAtTime(90, t + 3.6);
    const bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(1800, t + 3.6); bp.Q.value = 3;
    const sg = audio.createGain(); sg.gain.setValueAtTime(0.0001, t + 0.3); sg.gain.exponentialRampToValueAtTime(0.05, t + 2.2); sg.gain.exponentialRampToValueAtTime(0.01, t + 4.5);
    sp.connect(bp).connect(sg).connect(master); sp.start(t + 0.3);
    hum = [[fan, fg], [hm, hg], [sp, sg]];
  },
  powerOff() {
    if (!audio) return; const t = audio.currentTime;
    for (const [src, g] of hum) { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value, 0.0001), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2); src.stop(t + 1.3); }
    hum = []; thump(t, 50, 0.15, 0.3);
  },
  floppy() {    /* disquetera A: — motor y pasos del cabezal ("grrr-grrr") */
    if (!audio) return; let t = audio.currentTime + 0.02;
    const m = audio.createBufferSource(); m.buffer = noiseBuffer(1.3);
    const ml = audio.createBiquadFilter(); ml.type = 'lowpass'; ml.frequency.value = 260;
    const mg = audio.createGain(); env(mg, t, 0.07, 0.05, 1.2); m.connect(ml).connect(mg).connect(master); m.start(t);
    thump(t, 140, 0.05, 0.25);
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < 38; i++) { click(t, 1100 + (pass ? 200 : 0), 0.004, 0.16); t += 0.0062; }
      t += 0.13;
    }
    thump(t, 120, 0.05, 0.2);
  },
  key(down) {   /* teclado mecanico */
    if (!audio) return; const t = audio.currentTime + 0.005;
    click(t, down ? 3400 : 2300, 0.006, down ? 0.2 : 0.08); thump(t, down ? 240 : 170, 0.018, down ? 0.07 : 0.03);
  },
  degauss() {   /* monitor CRT: "bwoom" de desmagnetizacion */
    if (!audio) return; const t = audio.currentTime + 0.05;
    const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 60;
    const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500;
    const g = audio.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 1.2); thump(t, 45, 0.12, 0.35);
  },
  beep() {      /* beep del POST por el altavoz del PC */
    if (!audio) return; const t = audio.currentTime + 0.02;
    const o = audio.createOscillator(); o.type = 'square'; o.frequency.value = 990;
    const g = audio.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.005);
    g.gain.setValueAtTime(0.06, t + 0.16); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.2);
  },
  chatter(seconds) {   /* cabezal del disco duro buscando, con su LED */
    if (!audio) return; const t0 = audio.currentTime; let t = t0 + 0.02;
    while (t < t0 + seconds) {
      if (Math.random() < 0.85) { click(t, 2600 + Math.random() * 1400, 0.012, 0.22 + Math.random() * 0.15); thump(t, 170, 0.025, 0.08); }
      const ms = (t - t0) * 1000; setTimeout(() => { hddLed.classList.add('on'); setTimeout(() => hddLed.classList.remove('on'), 45); }, ms);
      t += 0.025 + Math.random() * (Math.random() < 0.2 ? 0.35 : 0.09);
    }
  },
};
function pushSound(samples) {
  if (!audio || audio.state !== 'running' || !ci) return;
  const now = audio.currentTime;
  if (nextT < now + 0.02) nextT = now + 0.05;
  if (nextT - now > 0.35) return;
  const buf = audio.createBuffer(1, samples.length, ci.soundFrequency() || 44100); buf.copyToChannel(samples, 0);
  const src = audio.createBufferSource(); src.buffer = buf; src.connect(master); src.start(nextT);
  nextT += buf.duration;
}
$('snd').addEventListener('click', () => {
  soundOn = !soundOn; $('snd').textContent = soundOn ? 'Sonido: sí' : 'Sonido: no'; $('snd').setAttribute('aria-pressed', String(!soundOn));
  if (master) master.gain.value = soundOn ? 1 : 0;
});

/* ---------- discos: se descargan en cuanto abre la pagina ---------- */
let diskPct = 0, diskErr = null;
const diskPromise = loadDisks(p => { diskPct = p; }).then(b => (bundle = b), e => { diskErr = e; throw e; });
diskPromise.catch(() => {});

/* ---------- POST de BIOS (simulado) ---------- */
let lines = [];
const draw = (tail) => say(lines.join('\n') + (tail || ''));
const put = (l) => { lines.push(l); draw(); };
async function post(id) {
  lines = []; txt.hidden = false; cv.hidden = true; $('off').hidden = true;
  put(''); put('  <span class="w">DOS486 BIOS v1.0</span>        (C) 1993'); put('');
  put('  <span class="c">486DX2-66</span> CPU at 66 MHz'); put('');
  const mi = lines.length; put('');
  const t0 = performance.now();
  for (let k = 0; k <= 32768; k = Math.min(32768, k + 1024)) {
    if (id !== session) return false;
    lines[mi] = '  Memory Test : ' + String(k).padStart(6) + 'K' + (k === 32768 ? ' OK' : ''); draw();
    if (k === 32768) break;
    await sleep(55);
  }
  await sleep(300); put('');
  put('  Floppy drive A: ........... 1.44M, 3.5 in.'); SFX.floppy(); await sleep(900);
  if (id !== session) return false;
  put('  IDE Primary Master ........ DOS486 HDD 32MB'); SFX.chatter(0.4); await sleep(450);
  put('  IDE Primary Slave ......... JUEGOS2 HDD 96MB'); SFX.chatter(0.3); await sleep(400);
  put('  Sound Blaster 16 .......... A220 I5 D1 H5'); await sleep(350);
  if (id !== session) return false;
  SFX.beep(); await sleep(450);
  put(''); put('  Booting from Hard Disk...');
  while (!bundle && !diskErr) {
    if (id !== session) return false;
    statusEl.textContent = 'Leyendo discos… ' + Math.round(diskPct * 100) + ' %';
    SFX.chatter(0.6); await sleep(600);
  }
  if (diskErr) throw diskErr;
  return performance.now() - t0 >= 0;
}

/* ---------- arranque ---------- */
let on = false;
async function boot() {
  const id = ++session; ready = false; setEnabled(false);
  try {
    statusEl.textContent = 'POST…';
    const ok = await post(id); if (!ok || id !== session) return;
    statusEl.textContent = 'Arrancando FreeDOS…';
    if (!window.emulators) throw new Error('no se cargó el emulador');
    emulators.pathPrefix = 'emulators/';
    const c = await emulators.dosboxXWorker([bundle]);
    if (id !== session) { c.exit().catch(() => {}); return; }
    ci = c;
    const bootChatter = setInterval(() => { if (!ready && id === session) SFX.chatter(0.9); else clearInterval(bootChatter); }, 900);
    SFX.chatter(0.9);
    let shown = false; const t0 = performance.now();
    ci.events().onFrame((rgb, rgba) => {
      if (id !== session || !ci) return;
      const w = ci.width(), h = ci.height(); if (!w || !h) return;
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      let data = rgba;
      if (!data && rgb) { data = new Uint8ClampedArray(w * h * 4);
        for (let i = 0, j = 0; i < rgb.length; i += 3, j += 4) { data[j] = rgb[i]; data[j + 1] = rgb[i + 1]; data[j + 2] = rgb[i + 2]; data[j + 3] = 255; } }
      if (!data || data.length < w * h * 4) return;
      ctx.putImageData(new ImageData(new Uint8ClampedArray(data.buffer, data.byteOffset, w * h * 4), w, h), 0, 0);
      if (!shown && performance.now() - t0 > 600) { shown = true; cv.hidden = false; txt.hidden = true; }
      if (!ready && h === 400 && hasReadyBar(data, w, h)) setTimeout(() => markReady(id), 500);
    });
    ci.events().onSoundPush(pushSound);
    setTimeout(() => markReady(id), 40000);   /* por si no se detecta la barra */
  } catch (err) {
    if (id !== session) return;
    cv.hidden = true; txt.hidden = false;

const PAL = ['#000000', '#0000aa', '#00aa00', '#00aaaa', '#aa0000', '#aa00aa', '#aa5500', '#aaaaaa',
             '#555555', '#5555ff', '#55ff55', '#55ffff', '#ff5555', '#ff55ff', '#ffff55', '#ffffff'];
const COLS = 80, ROWS = 25;
const term = { rows: [], x: 0, y: 0, fg: 7, cps: 1440 };
let bbsActive = false, bbsToken = 0, keyWaiter = null, savedCmds = null;
class BbsAbort extends Error {}
const check = (tok) => { if (!bbsActive || tok !== bbsToken) throw new BbsAbort(); };

function fitTerm() {
  const probe = document.createElement('span');
  probe.style.cssText = 'font:100px "JetBrains Mono", monospace;position:absolute;visibility:hidden;white-space:pre';
  probe.textContent = 'M'.repeat(COLS); document.body.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / COLS / 100; probe.remove();
  const w = screenEl.clientWidth * 0.96, h = screenEl.clientHeight * 0.96;
  txt.style.fontSize = Math.max(5, Math.min(w / (COLS * cw), h / (ROWS * 1.12))) + 'px';
}
addEventListener('resize', () => { if (bbsActive) fitTerm(); });
function tClear() { term.rows = Array.from({ length: ROWS }, () => []); term.x = 0; term.y = 0; tRender(); }
function tPut(ch) {
  if (ch === '\n') { term.x = 0; term.y++; }
  else {
    if (term.x >= COLS) { term.x = 0; term.y++; }
    if (term.y >= ROWS) { term.rows.shift(); term.rows.push([]); term.y = ROWS - 1; }
    term.rows[term.y][term.x] = [ch, term.fg]; term.x++;
  }
  if (term.y >= ROWS) { term.rows.shift(); term.rows.push([]); term.y = ROWS - 1; }
}
function tBack() { if (term.x > 0) { term.x--; term.rows[term.y][term.x] = undefined; } }
const escH = (c) => c === '<' ? '&lt;' : c === '&' ? '&amp;' : c === '>' ? '&gt;' : c;
function tRender() {
  let html = '';
  for (let y = 0; y < ROWS; y++) {
    const row = term.rows[y] || []; let cur = -1, seg = '';
    const flush = () => { if (seg) html += cur < 0 ? seg : `<span style="color:${PAL[cur]}">${seg}</span>`; seg = ''; };
    const len = Math.max(row.length, y === term.y ? term.x + 1 : 0);
    for (let x = 0; x < len; x++) {
      if (y === term.y && x === term.x) { flush(); cur = -1; html += '<span class="blink">_</span>'; continue; }
      const c = row[x], col = c ? c[1] : 7, ch = c ? c[0] : ' ';
      if (col !== cur) { flush(); cur = col; }
      seg += escH(ch);
    }
    flush(); if (y < ROWS - 1) html += '\n';
  }
  txt.innerHTML = html;
}
/* Escribe texto con codigos {n} de color (0-15) y {cls}, a la velocidad del modem */
async function print(s, tok, cps) {
  const speed = cps || term.cps; const items = [];
  s.replace(/\{(cls|\d{1,2})\}|([\s\S])/g, (m, code, ch) => { items.push(code !== undefined ? { code } : { ch }); return ''; });
  let i = 0, last = performance.now(), carry = 0;
  while (i < items.length) {
    check(tok);
    await new Promise(r => requestAnimationFrame(r));
    const now = performance.now(); carry += (now - last) / 1000 * speed; last = now;
    let n = Math.floor(carry); carry -= n; if (n < 1) continue;
    while (n > 0 && i < items.length) {
      const it = items[i++];
      if (it.code === 'cls') tClear(); else if (it.code !== undefined) term.fg = +it.code; else { tPut(it.ch); n--; }
    }
    tRender();
  }
}
const vis = (s) => s.replace(/\{(cls|\d{1,2})\}/g, '');
function box(title, lines, w, c = 9) {
  const top = `{${c}}╔${'═'.repeat(Math.floor((w - 2 - vis(title).length - 2) / 2))} {15}${title}{${c}} ${'═'.repeat(Math.ceil((w - 2 - vis(title).length - 2) / 2))}╗\n`;
  const body = lines.map(l => `{${c}}║{7}${l}${' '.repeat(Math.max(0, w - 2 - vis(l).length))}{${c}}║\n`).join('');
  return top + body + `{${c}}╚${'═'.repeat(w - 2)}╝{7}\n`;
}

}
function feedKey(k) {
  if (!keyWaiter) return;
  const w = keyWaiter;
  if (w.line) {
    if (k === '\r') { keyWaiter = null; tPut('\n'); tRender(); w.resolve(w.buf); return; }
    if (k === '\b') { if (w.buf) { w.buf = w.buf.slice(0, -1); tBack(); tRender(); } return; }
    if (k.length === 1 && k >= ' ' && w.buf.length < w.max) { w.buf += k; tPut(k); tRender(); }
    return;
  }
  const up = k.toUpperCase();
  if (!w.allowed || w.allowed.includes(up)) { keyWaiter = null; w.resolve(up); }
}
function getKey(tok, allowed, hot) { check(tok); if (hot) setHotkeys(hot); return new Promise(r => { keyWaiter = { resolve: r, allowed }; }); }
function getLine(tok, max, hot) { check(tok); setHotkeys(hot || [['\r', 'Enter']]); return new Promise(r => { keyWaiter = { resolve: r, line: true, buf: '', max }; }); }

/* ---------- sonido del modem (sintetizado) ---------- */
function modemSound() {
  if (!audio) return 0;
  const t0 = audio.currentTime + 0.05; let t = t0;
  const hp = audio.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
  const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3400;
  const line = audio.createGain(); line.gain.value = 0.9; hp.connect(lp).connect(line).connect(master);
  const tone = (at, f, dur, g) => { const o = audio.createOscillator(); o.frequency.value = f; const gg = audio.createGain();
    gg.gain.setValueAtTime(0.0001, at); gg.gain.exponentialRampToValueAtTime(g, at + 0.01); gg.gain.setValueAtTime(g, at + dur - 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(gg).connect(hp); o.start(at); o.stop(at + dur + 0.02); };
  const noise = (at, dur, f, q, g) => { const n = audio.createBufferSource(); n.buffer = noiseBuffer(dur + 0.05);
    const bp = audio.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; const gg = audio.createGain();
    gg.gain.setValueAtTime(0.0001, at); gg.gain.exponentialRampToValueAtTime(g, at + 0.03); gg.gain.setValueAtTime(g, at + dur - 0.05); gg.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    n.connect(bp).connect(gg).connect(hp); n.start(at); n.stop(at + dur + 0.05); };
  const fsk = (at, dur, f1, f2, g) => { const o = audio.createOscillator(); const gg = audio.createGain();
    for (let x = 0; x < dur; x += 0.0033) o.frequency.setValueAtTime(Math.random() < 0.5 ? f1 : f2, at + x);
    gg.gain.setValueAtTime(0.0001, at); gg.gain.exponentialRampToValueAtTime(g, at + 0.01); gg.gain.setValueAtTime(g, at + dur - 0.01); gg.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(gg).connect(hp); o.start(at); o.stop(at + dur + 0.02); };
  thump(t, 90, 0.05, 0.25);                                        // descolgar
  t += 0.25; tone(t, 350, 1.3, 0.08); tone(t, 440, 1.3, 0.08);    // tono de marcar
  t += 1.45;
  const DT = { '1': [697, 1209], '5': [770, 1336], '9': [852, 1477], '3': [697, 1477] };
  for (const d of '5551993') { tone(t, DT[d][0], 0.09, 0.1); tone(t, DT[d][1], 0.09, 0.1); t += 0.16; }
  const ring = t + 0.5; tone(ring, 440, 1.6, 0.06); tone(ring, 480, 1.6, 0.06);       // tono de llamada
  const ans = ring + 2.3; tone(ans, 2100, 1.9, 0.09);                                  // tono de respuesta
  let n2 = ans + 2.0;
  fsk(n2, 0.55, 1650, 1850, 0.08); n2 += 0.6;                                          // V.21
  tone(n2, 1800, 0.55, 0.08); n2 += 0.55; tone(n2, 600, 0.45, 0.06); tone(n2, 3000, 0.45, 0.05); n2 += 0.5;   // "biiii-buuuu"
  noise(n2, 1.1, 1800, 0.6, 0.35); noise(n2 + 1.1, 0.45, 1000, 0.9, 0.3); noise(n2 + 1.55, 1.3, 2300, 0.5, 0.4); n2 += 2.9; // "kssshhhh"
  return { ring: (ring - t0) * 1000, answer: (ans - t0) * 1000, train: (ans + 2 - t0) * 1000, total: (n2 - t0) * 1000 };
}

  const ITEMS = [

    ['Tu correo', 'Buzon de entrada: 1 mensaje.\n\n  De: amigo@uni.cl (ficticio)\n  Asunto: ¿Ya probaste el Doom?\n\n  Lo baje del BBS anoche. Esta increible. Hay que\n  armar una red IPX para jugar en modo deathmatch.'],
    ['Usenet: comp.sys.ibm.pc.games', 'Hilos de hoy (ficticios):\n\n  * Mejor tarjeta de sonido: ¿SB16 o Gravis UltraSound?\n  * Wolf3D vs. Blake Stone\n  * ¿Cuanta RAM necesita el Doom? (4 MB minimo)'],
  ];
  for (;;) {
    await print('{cls}\n' + box('GOPHER · PASARELA INTERNET (SIMULADA)', ['', ...ITEMS.map(([t], i) => `   {14}${i + 1}{7}. ${t}`), '   {14}V{7}. Volver al BBS', ''], 60) + '\n{11}  Opcion{7}: {15}', tok);
    const k = await getKey(tok, '123V', [...ITEMS.map(([t], i) => [String(i + 1), t]), ['V', 'Volver']]);
    if (k === 'V') return;
    const [t, body] = ITEMS[+k - 1];
    await print(`{cls}\n{15}  ${t}\n{8}  ${'─'.repeat(56)}{7}\n\n` + body.split('\n').map(l => '  ' + l).join('\n') + '\n\n{8}  [Pulsa una tecla]{7}', tok);
    await anyKey(tok);
  }
}

async function bbsStart() {
  if (bbsActive || !ready) return;
  bbsActive = true; const tok = ++bbsToken;
  savedCmds = $('cmds').innerHTML;
  if (ci) { try { ci.pause(); } catch (_) {} }
  cv.hidden = true; txt.hidden = false; txt.classList.add('term'); fitTerm();
  statusEl.textContent = 'Programa de terminal';
  try { await bbsSession(tok); }
  catch (e) { if (!(e instanceof BbsAbort)) console.error(e); }
  finally { if (tok === bbsToken) bbsEnd(); }
}
function bbsEnd() {
  if (!bbsActive) return;
  bbsActive = false; bbsToken++; keyWaiter = null;
  txt.classList.remove('term'); txt.style.fontSize = '';
  $('cmds').innerHTML = savedCmds || ''; setEnabled(ready);
  if (ci) { try { ci.resume(); } catch (_) {} cv.hidden = false; txt.hidden = true; screenEl.focus(); }
  if (ready) statusEl.textContent = 'Listo. Un clic escribe el comando en DOS; sal del programa abierto antes de cargar otro.';
}

/* ---------- comandos preseteados: se escriben en DOS tecla a tecla ---------- */
async function tap(k) { if (!ci) return; SFX.key(true); ci.sendKeyEvent(k, true); await sleep(45); if (ci) ci.sendKeyEvent(k, false); SFX.key(false); await sleep(55); }
async function typeCommand(cmd) {
  if (!ci || !ready || typing) return;
  typing = true; setEnabled(false);
  try { for (const ch of cmd) await tap(ch.charCodeAt(0)); await tap(257); SFX.chatter(2.2); }
  finally { typing = false; setEnabled(true); screenEl.focus(); }
}
$('cmds').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  ensureAudio();
  if (b.dataset.bbs !== undefined) { SFX.key(true); feedKey(b.dataset.bbs === 'ENTER' ? '\r' : b.dataset.bbs); return; }
  if (b.dataset.cmd === 'BBS') { bbsStart(); return; }
  typeCommand(b.dataset.cmd);
});

/* ---------- teclado ---------- */
const K = { Escape:256, Enter:257, Tab:258, Backspace:259, Insert:260, Delete:261, ArrowRight:262, ArrowLeft:263, ArrowDown:264, ArrowUp:265,
  PageUp:266, PageDown:267, Home:268, End:269, CapsLock:280, ScrollLock:281, NumLock:282, Pause:284, Space:32,
  ShiftLeft:340, ControlLeft:341, AltLeft:342, ShiftRight:344, ControlRight:345, AltRight:346,
  Minus:45, Equal:61, Backslash:92, BracketLeft:91, BracketRight:93, Semicolon:59, Quote:39, Period:46, Comma:44, Slash:47, Backquote:96,
  NumpadEnter:335, NumpadAdd:334, NumpadSubtract:333, NumpadMultiply:332, NumpadDivide:331, NumpadDecimal:330, IntlBackslash:348 };
function code2key(code) {
  if (K[code] !== undefined) return K[code];
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1].charCodeAt(0);
  if ((m = /^Digit([0-9])$/.exec(code))) return 48 + +m[1];
  if ((m = /^F([0-9]{1,2})$/.exec(code))) return 289 + +m[1];
  if ((m = /^Numpad([0-9])$/.exec(code))) return 320 + +m[1];
  return null;
}
function keyEvent(e, down) {
  if (e.metaKey || e.ctrlKey && e.key !== 'Control') { if (!bbsActive) { /* sigue */ } }
  if (bbsActive) {
    if (e.target.closest && e.target.closest('a')) return;
    if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') e.preventDefault();
    if (down) { ensureAudio(); SFX.key(true); feedKey(e.key === 'Enter' ? '\r' : e.key === 'Backspace' ? '\b' : e.key); }
    else SFX.key(false);
    return;
  }
  if (!ci || e.metaKey) return;
  if (e.target.closest && e.target.closest('button, a')) return;
  const k = code2key(e.code); if (k === null) return;
  e.preventDefault(); ensureAudio(); SFX.key(down);
  if (down && k === 257) SFX.chatter(1.2);
  ci.sendKeyEvent(k, down);
}
addEventListener('keydown', e => keyEvent(e, true));
addEventListener('keyup', e => keyEvent(e, false));
screenEl.addEventListener('click', () => { ensureAudio(); screenEl.focus(); });

/* ---------- raton: doble clic en la pantalla lo captura ---------- */
screenEl.addEventListener('dblclick', () => { if (ci && screenEl.requestPointerLock) { try { const p = screenEl.requestPointerLock(); p && p.catch && p.catch(() => {}); } catch (_) {} } });
document.addEventListener('mousemove', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseRelativeMotion(e.movementX, e.movementY); });
screenEl.addEventListener('mousedown', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseButton(e.button === 2 ? 1 : 0, true); });
screenEl.addEventListener('mouseup', e => { if (ci && document.pointerLockElement === screenEl) ci.sendMouseButton(e.button === 2 ? 1 : 0, false); });
screenEl.addEventListener('contextmenu', e => e.preventDefault());

})();
</script>
